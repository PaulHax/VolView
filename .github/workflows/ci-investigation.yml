name: Focused CI investigation
on:
  push:
    branches: [image-segment-ci-probes]

permissions:
  contents: read

jobs:
  investigate:
    if: github.repository == 'PaulHax/VolView'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            prefix: ''
            lifecycle: '1'
            legacy: '1'
          - os: ubuntu-latest
            prefix: ''
            lifecycle: '1'
            legacy: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      VITE_SHOW_SAMPLE_DATA: true
      DOWNLOAD_TIMEOUT: 90000
      CI_ORIGINAL_PREFIX: ${{ matrix.prefix }}
      CI_LIFECYCLE_ONLY: ${{ matrix.lifecycle }}
      CI_LEGACY_MENU: ${{ matrix.legacy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/install-e2e-browser.mjs
      - name: Reproduce browser availability failure with cached Chrome
        run: node scripts/investigate-browser-setup.mjs
      - name: Verify restore readiness with pending mask decoding
        run: npx vitest run src/components/__tests__/restorePanelReadiness.spec.ts src/io/import/__tests__/restoreViewContent.spec.ts
      - name: Cache datasets for the original test sequence
        if: matrix.prefix == '1'
        uses: actions/cache@v4
        with:
          path: .tmp/datasets
          key: e2e-datasets-${{ hashFiles('tests/datasets.ts') }}
          restore-keys: e2e-datasets-
      - run: npx vite build
      - name: Verify the menu failure control and successful wait
        if: matrix.prefix != '1' && matrix.lifecycle != '1'
        run: |
          npx wdio run wdio.investigation.conf.ts --spec tests/specs/menu-readiness-probe.e2e.ts --mochaOpts.grep "CI menu readiness"
          mkdir -p .tmp/ci-investigation
          mv .tmp/runs .tmp/ci-investigation/menu-proof
      - name: Run the selected diagnostic sequence
        shell: bash
        run: |
          mkdir -p .tmp/ci-investigation
          result=0
          for position in first second; do
            if [[ "$position" == first ]]; then
              legacy='${{ matrix.legacy }}'
            elif [[ '${{ matrix.legacy }}' == 1 ]]; then
              legacy=''
            else
              legacy=1
            fi
            echo "Lifecycle comparison: position=$position legacy=$legacy"
            if ! CI_LEGACY_MENU="$legacy" npx wdio run wdio.investigation.conf.ts; then
              result=1
            fi
            mv .tmp/runs ".tmp/ci-investigation/$position"
          done
          exit "$result"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-investigation-${{ matrix.os }}-${{ matrix.lifecycle }}-${{ matrix.legacy }}-${{ github.run_attempt }}
          path: |
            .tmp/ci-investigation
            .tmp/runs
          retention-days: 7
