name: Focused CI investigation
on:
  push:
    branches: [image-segment-ci-probes]

permissions:
  contents: read

jobs:
  investigate:
    if: github.repository == 'PaulHax/VolView'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VITE_SHOW_SAMPLE_DATA: true
      DOWNLOAD_TIMEOUT: 90000
      CI_ORIGINAL_PREFIX: '1'
      CI_LIFECYCLE_PREFIX: '1'
      CI_LINUX_NATIVE_STALL: '1'
      CI_BROWSER_GPU_INFO: '1'
      CI_LIFECYCLE_COMMANDS: '1'
      CI_NO_PAGE_INSTRUMENTATION: '1'
      ORIGINAL_REV: 55dc25a8bf7aea46815b554da11b40880ebd19a2
    steps:
      - uses: actions/checkout@v4
      - name: Restore original failing application and tests
        run: |
          git fetch --no-tags origin "$ORIGINAL_REV"
          git restore --source="$ORIGINAL_REV" --worktree -- src tests
          git diff --exit-code "$ORIGINAL_REV" -- src tests
          git diff --stat "$ORIGINAL_REV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify native sampler
        run: gdb --version
      - run: npm ci
      - run: node scripts/install-e2e-browser.mjs
      - name: Cache original lead-in datasets
        uses: actions/cache@v4
        with:
          path: .tmp/datasets
          key: e2e-datasets-${{ hashFiles('tests/datasets.ts') }}
          restore-keys: e2e-datasets-
      - run: npx vite build
      - name: Sample original Linux long commands across Chrome processes
        timeout-minutes: 110
        run: |
          mkdir -p .tmp/ci-investigation
          python3 scripts/investigate-linux-host.py .tmp/ci-investigation/linux-host.jsonl &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          npx wdio run wdio.investigation.conf.ts
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-investigation-original-prefix-native-all-linux-${{ github.run_attempt }}
          path: |
            .tmp/ci-investigation
            .tmp/runs
          retention-days: 7
