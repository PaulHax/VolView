name: Focused CI investigation
on:
  push:
    branches: [image-segment-ci-probes]

permissions:
  contents: read

jobs:
  investigate:
    if: github.repository == 'PaulHax/VolView'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VITE_SHOW_SAMPLE_DATA: true
      DOWNLOAD_TIMEOUT: 90000
      CI_ORIGINAL_PREFIX: '1'
      CI_NO_PAGE_INSTRUMENTATION: '1'
      CI_BROWSER_GPU_INFO: '1'
      CI_FIXTURE_DIAGNOSTIC_DIR: .tmp/ci-investigation/fixture-requests
      ORIGINAL_REV: 55dc25a8bf7aea46815b554da11b40880ebd19a2
    steps:
      - uses: actions/checkout@v4
      - name: Restore original failing application and tests
        run: |
          git fetch --no-tags origin "$ORIGINAL_REV"
          git restore --source="$ORIGINAL_REV" --worktree -- src tests
          # Only the server-side request logger is retained under tests.
          git restore --source="$GITHUB_SHA" --worktree -- tests/fixtures/vtkFixtureServer.mjs
          git diff --exit-code "$ORIGINAL_REV" -- src tests ':!tests/fixtures/vtkFixtureServer.mjs'
          git diff --stat "$ORIGINAL_REV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/install-e2e-browser.mjs
      - name: Cache original lead-in datasets
        uses: actions/cache@v4
        with:
          path: .tmp/datasets
          key: e2e-datasets-${{ hashFiles('tests/datasets.ts') }}
          restore-keys: e2e-datasets-
      - run: npx vite build
      - name: Replay original lead-in with external post-spec GPU info
        timeout-minutes: 30
        run: |
          npx wdio run wdio.investigation.conf.ts
          mkdir -p .tmp/ci-investigation
          mv .tmp/runs .tmp/ci-investigation/original-source-prefix
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-investigation-external-gpu-macos-latest-${{ github.run_attempt }}
          path: |
            .tmp/ci-investigation
            .tmp/runs
          retention-days: 7
