name: Focused CI investigation
on:
  push:
    branches: [image-segment-ci-probes]

permissions:
  contents: read

jobs:
  investigate:
    if: github.repository == 'PaulHax/VolView'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VITE_SHOW_SAMPLE_DATA: true
      DOWNLOAD_TIMEOUT: 90000
      CI_FIXTURE_DIAGNOSTIC_DIR: .tmp/ci-investigation/fixture-requests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/install-e2e-browser.mjs
      - name: Reproduce browser availability failure with cached Chrome
        run: node scripts/investigate-browser-setup.mjs
      - name: Verify restore readiness with pending mask decoding
        run: npx vitest run src/components/__tests__/restorePanelReadiness.spec.ts src/io/import/__tests__/restoreViewContent.spec.ts
      - name: Cache original lead-in datasets
        uses: actions/cache@v4
        with:
          path: .tmp/datasets
          key: e2e-datasets-${{ hashFiles('tests/datasets.ts') }}
          restore-keys: e2e-datasets-
      - run: npx vite build
      - name: Verify pending clickability wait during real entry on Apple Metal
        timeout-minutes: 5
        run: |
          npx wdio run wdio.investigation.conf.ts --spec tests/specs/menu-readiness-probe.e2e.ts --mochaOpts.grep "CI menu readiness"
          mkdir -p .tmp/ci-investigation
          mv .tmp/runs .tmp/ci-investigation/menu-proof
      - name: Replay original 27-spec lead-in with renderer and host stall capture
        timeout-minutes: 30
        env:
          CI_ORIGINAL_PREFIX: '1'
        run: |
          npx wdio run wdio.investigation.conf.ts
          mv .tmp/runs .tmp/ci-investigation/original-prefix
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-investigation-macos-latest-${{ github.run_attempt }}
          path: |
            .tmp/ci-investigation
            .tmp/runs
          retention-days: 7
