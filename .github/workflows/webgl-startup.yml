name: WebGL paint display comparison
on:
  pull_request:

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'PaulHax/VolView' && github.head_ref == 'webgl-startup-order'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        order: [headless-then-headed, headed-then-headless]
    name: Ubuntu display (${{ matrix.order }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SHOW_SAMPLE_DATA: true
      CHROME_VERSION: 155.0.8059.84
      WEBGL_STARTUP_SPEC: ./tests/specs/paint-tool-rendering.e2e.ts
      WEBGL_STARTUP_DIAGNOSTICS: '0'
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache test datasets
        uses: actions/cache@v4
        with:
          path: .tmp/datasets
          key: e2e-datasets-${{ hashFiles('tests/datasets.ts') }}
          restore-keys: e2e-datasets-
      - name: Install Xvfb
        run: sudo apt-get install xvfb
      - name: Build
        run: npm run build
      - name: Run ordered browser sessions
        run: node scripts/run-webgl-startup.mjs "${{ matrix.order }}"
      - name: Preserve results and browser configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-paint-display-${{ matrix.order }}-attempt-${{ github.run_attempt }}
          path: |
            .tmp/webgl-startup
            .tmp/runs
          retention-days: 7
