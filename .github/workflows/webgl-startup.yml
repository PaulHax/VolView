name: WebGL-only full-suite validation
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'PaulHax/VolView' && github.head_ref == 'webgl-startup-order'
    name: Headed Ubuntu (WebGL-only full suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SHOW_SAMPLE_DATA: true
      CHROME_VERSION: 155.0.8059.84
      HEADED: 1
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache test datasets
        uses: actions/cache@v4
        with:
          path: .tmp/datasets
          key: e2e-datasets-${{ hashFiles('tests/datasets.ts') }}
          restore-keys: e2e-datasets-
      - name: Install Xvfb
        run: sudo apt-get install xvfb
      - name: Build
        run: npm run build
      - name: Record validation configuration
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { config } from './wdio.webgl-validation.conf.ts';
          import { DOWNLOAD_TIMEOUT } from './wdio.shared.conf.ts';
          await mkdir('.tmp/webgl-validation', { recursive: true });
          await writeFile('.tmp/webgl-validation/metadata.json', JSON.stringify({
            recordedAt: new Date().toISOString(),
            runner: {
              os: process.env.RUNNER_OS,
              architecture: process.env.RUNNER_ARCH,
              imageOS: process.env.ImageOS,
              imageVersion: process.env.ImageVersion,
            },
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            workflowSha: process.env.GITHUB_SHA,
            requestedCapabilities: config.capabilities,
            specs: config.specs,
            maxInstances: config.maxInstances,
            downloadTimeout: DOWNLOAD_TIMEOUT,
            waitforTimeout: config.waitforTimeout,
            connectionRetryTimeout: config.connectionRetryTimeout,
            connectionRetryCount: config.connectionRetryCount,
            mochaTimeout: config.mochaOpts?.timeout,
          }, null, 2) + '\n', { flag: 'wx' });
          NODE
      - name: Run full browser suite
        run: xvfb-run --server-args="-screen 0, 1400x1000x24" --auto-servernum npx wdio run ./wdio.webgl-validation.conf.ts
      - name: Preserve results and configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-only-validation-ubuntu-attempt-${{ github.run_attempt }}
          path: |
            .tmp/webgl-validation
            .tmp/runs
          retention-days: 7
