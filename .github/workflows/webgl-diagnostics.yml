name: Ubuntu WebGL diagnostics
on:
  push:
    branches:
      - e2e-ci-stability

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'PaulHax/VolView'
    name: Headed Ubuntu E2E
    runs-on: ubuntu-latest
    env:
      DOWNLOAD_TIMEOUT: 90000
      VITE_SHOW_SAMPLE_DATA: true
      VOLVIEW_WEBGL_DIAGNOSTICS: 1
      HEADED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          DETECT_CHROMEDRIVER_VERSION: true
      - name: Cache test datasets
        uses: actions/cache@v4
        with:
          path: .tmp/datasets
          key: e2e-datasets-${{ hashFiles('tests/datasets.ts') }}
          restore-keys: e2e-datasets-
      - name: Install xvfb
        run: sudo apt-get install xvfb
      - name: Run E2E on chrome
        run: xvfb-run --server-args="-screen 0, 1400x1000x24" --auto-servernum npm run test:e2e:chrome
      - name: Archive test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: webgl_ubuntu_headed_attempt_${{ github.run_attempt }}
          path: .tmp/runs
          retention-days: 5
