name: E2E Rendering Investigation
on:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: Rendering investigation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      DOWNLOAD_TIMEOUT: 90000
      VITE_SHOW_SAMPLE_DATA: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '157.0.8103.26'
          install-chromedriver: true
      - name: Cache test datasets
        uses: actions/cache@v4
        with:
          path: .tmp/datasets
          key: e2e-datasets-${{ hashFiles('tests/datasets.ts') }}
          restore-keys: e2e-datasets-
      - name: Run E2E on chrome (linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY npm run test:e2e:chrome -- --spec tests/specs/label-outline.e2e.ts --spec tests/specs/slice-display-lifecycle.e2e.ts
      - name: Set screen resolution (windows)
        if: matrix.os == 'windows-latest'
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
        shell: pwsh
      - name: Run E2E on chrome (non-linux)
        if: matrix.os != 'ubuntu-latest'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: npm run test:e2e:chrome -- --spec tests/specs/label-outline.e2e.ts --spec tests/specs/slice-display-lifecycle.e2e.ts
      - name: Archive test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: image_comparison_results_${{ matrix.os }}
          path: .tmp/runs
          retention-days: 5
